<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Water Bottle Gradient -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95" />
    </linearGradient>

    <!-- Liquid Wave Gradient -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Glass Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Label Gradient -->
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0f9ff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow underneath -->
  <ellipse cx="200" cy="520" rx="90" ry="18" fill="rgba(15, 23, 42, 0.35)" filter="url(#glow)" />
  <ellipse cx="200" cy="516" rx="70" ry="12" fill="rgba(2, 132, 199, 0.4)" />

  <!-- Outer Water Splash Droplets -->
  <circle cx="90" cy="240" r="10" fill="#38bdf8" opacity="0.75" />
  <circle cx="75" cy="310" r="6" fill="#7dd3fc" opacity="0.6" />
  <circle cx="310" cy="210" r="8" fill="#38bdf8" opacity="0.7" />
  <circle cx="325" cy="290" r="12" fill="#0284c7" opacity="0.6" />
  <circle cx="110" cy="450" r="7" fill="#38bdf8" opacity="0.5" />
  <circle cx="295" cy="430" r="9" fill="#7dd3fc" opacity="0.65" />

  <!-- BOTTLE CAP -->
  <rect x="175" y="40" width="50" height="26" rx="6" fill="url(#capGrad)" />
  <!-- Cap Ribs -->
  <line x1="183" y1="42" x2="183" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="192" y1="42" x2="192" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="200" y1="42" x2="200" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="208" y1="42" x2="208" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.4" />
  <line x1="217" y1="42" x2="217" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.4" />

  <!-- Cap Ring -->
  <rect x="171" y="66" width="58" height="8" rx="3" fill="#0369a1" />

  <!-- BOTTLE NECK -->
  <path d="M 175 74 L 175 110 C 175 130 135 150 135 180 L 135 480 C 135 500 155 510 200 510 C 245 510 265 500 265 480 L 265 180 C 265 150 225 130 225 110 L 225 74 Z" 
        fill="url(#bottleGrad)" 
        stroke="#bae6fd" 
        stroke-width="2" />

  <!-- LIQUID INSIDE -->
  <path d="M 137 200 C 160 190 240 210 263 200 L 263 478 C 263 496 243 506 200 506 C 157 506 137 496 137 478 Z" 
        fill="url(#liquidGrad)" 
        opacity="0.9" />

  <!-- BOTTLE LABEL -->
  <rect x="134" y="270" width="132" height="110" rx="10" fill="url(#labelGrad)" stroke="#e0f2fe" stroke-width="1.5" />
  
  <!-- Logo Drop Icon on Label -->
  <path d="M 200 292 C 185 315 180 328 180 338 C 180 350 189 358 200 358 C 211 358 220 350 220 338 C 220 328 215 315 200 292 Z" 
        fill="url(#liquidGrad)" />
  <circle cx="193" cy="332" r="3.5" fill="#ffffff" opacity="0.8" />

  <!-- Text on Label -->
  <text x="200" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#0369a1" letter-spacing="1">EASYLEARN</text>

  <!-- GLASS REFLECTION / SPECULAR HIGHLIGHT -->
  <path d="M 145 185 L 145 475 C 145 485 150 495 160 498 L 160 178 C 152 178 145 180 145 185 Z" 
        fill="url(#highlightGrad)" />
  
  <!-- Neck Highlight -->
  <path d="M 180 80 L 180 120 C 180 128 175 136 170 142 L 175 142 C 183 134 186 126 186 118 L 186 80 Z" 
        fill="#ffffff" 
        opacity="0.6" />

  <!-- Glass Rim Top Highlight -->
  <ellipse cx="200" cy="74" rx="25" ry="3" fill="#ffffff" opacity="0.5" />
</svg>
